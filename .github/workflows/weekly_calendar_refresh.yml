name: Weekly Calendar Refresh

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Economic_calendar

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install calendar dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full calendar refresh
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_full_calendar_refresh.py

      - name: Validate calendar coverage
        run: python check_all_dates.py

      - name: Commit updated calendar artifacts
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Economic_calendar/economic_calendar.db                   Economic_calendar/master_calendar.json                   Economic_calendar/all_calendar_results.json                   Economic_calendar/*_fetch_results.json
          git diff --cached --quiet || git commit -m "Refresh economic release calendar"
          git push
